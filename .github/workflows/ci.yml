name: TypeScript workspaces
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check:format
      - run: npm run check:docs
      - run: npm run check
      - run: npm test
      - run: npm run build
        env:
          VITE_NETWORK: local
          VITE_FEE_PAYMENT: sponsored
      - run: npm run pack:sdk
      - run: npm run test:consumer
